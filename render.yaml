services:
  - type: web
    name: tutku-erkek-kuaforu
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /js/*
        name: Cache-Control
        value: public, max-age=2592000
    routes:
      - type: rewrite
        source: /fiyatlar
        destination: /fiyatlar.html
      - type: rewrite
        source: /galeri
        destination: /galeri.html
      - type: rewrite
        source: /hakkimizda
        destination: /hakkimizda.html
      - type: rewrite
        source: /iletisim
        destination: /iletisim.html
      - type: rewrite
        source: /protez-sac
        destination: /protez-sac.html
      - type: rewrite
        source: /kvkk
        destination: /kvkk.html
